<div
  x-data="{ modes: [
    { label: 'Light', status: 'n', icon: 'sunny' },
    { label: 'Dark', status: 'y', icon: 'moon' },
    { label: 'System', status: 'auto', icon: 'desktop' }
  ] }"
  class="flex items-center gap-1 p-1 bg-base-100 border border-base-content/30 rounded-full"
>
  <template x-for="mode in modes" :key="mode.status">
    <button
      type="button"
      :aria-label="'Select ' + mode.label + ' mode'"
      class="maddy-theme-mode inline-flex justify-center items-center px-3 py-1 text-xs font-semibold rounded-full cursor-pointer hover:bg-primary hover:text-primary-content"
      style="min-width: 3.8rem; margin-inline: 0.15rem"
      :class="$store.darkMode.icon() === mode.icon && 'bg-primary text-primary-content'"
      @click="$store.darkMode.toggle(mode.status)"
      x-text="mode.label"
    ></button>
  </template>
</div>
